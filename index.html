<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadPredictor</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">

  <div class="logo-bar">
    <div class="logo">
      <span class="logo-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 4h18l-7 9v6l-4 2v-8z" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="logo-text"><span class="logo-text-light">Lead</span><span class="logo-text-bold">Predictor</span></span>
    </div>
  </div>

  <aside class="sidebar" id="sidebar">
    <div class="field">
      <label data-i18n="language">Language</label>
      <div id="language-select"></div>
    </div>

    <div class="field">
      <label for="currency-select" data-i18n="currency">Currency</label>
      <select id="currency-select">
        <option value="USD" selected>$ US Dollar</option>
        <option value="EUR">€ Euro</option>
        <option value="BGN">лв Bulgarian Lev</option>
        <option value="GBP">£ British Pound</option>
      </select>
    </div>

    <div class="field">
      <label for="campaign-start" data-i18n="campaignStart">Campaign Start</label>
      <input type="date" id="campaign-start" value="2026-05-08">
    </div>

    <div class="field">
      <label for="campaign-end" data-i18n="campaignEnd">Campaign End</label>
      <input type="date" id="campaign-end" value="2026-11-04">
    </div>

    <div class="field">
      <label for="total-revenue" data-i18n="totalRevenue">Total Revenue</label>
      <div class="input-with-prefix">
        <span class="prefix" data-currency-symbol>$</span>
        <input type="number" id="total-revenue" min="0" step="100" value="10000">
      </div>
    </div>

    <div class="field">
      <label for="avg-order-value" data-i18n="avgOrderValue">Avg. Order Value</label>
      <div class="input-with-prefix">
        <span class="prefix" data-currency-symbol>$</span>
        <input type="number" id="avg-order-value" min="1" step="10" value="1000">
      </div>
    </div>
  </aside>

  <main class="content">
    <section class="chart-panel">
      <div class="chart-container" id="chart-container"></div>
      <div class="stat-cards" id="stat-cards">
        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-icon">📥</span>
            <span class="stat-title" data-i18n="prospects">Prospects</span>
            <span class="stat-percent" id="prospects-percent">100%</span>
          </div>
          <div class="stat-value" id="prospects-value">0</div>
          <div class="progress-track"><div class="progress-fill" id="prospects-progress"></div></div>
        </div>

        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-icon">👤</span>
            <span class="stat-title" data-i18n="leads">Leads</span>
            <span class="stat-percent" id="leads-percent">0%</span>
          </div>
          <div class="stat-value" id="leads-value">0</div>
          <div class="progress-track"><div class="progress-fill" id="leads-progress"></div></div>
        </div>

        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-icon">🏆</span>
            <span class="stat-title" data-i18n="customers">Customers</span>
            <span class="stat-percent" id="customers-percent">0%</span>
          </div>
          <div class="stat-value" id="customers-value">0</div>
          <div class="progress-track"><div class="progress-fill" id="customers-progress"></div></div>
        </div>
      </div>
    </section>

    <section class="sliders-panel" id="sliders-panel">
      <div class="slider-group">
        <label for="lead-response-rate" data-i18n="leadResponseRate">Lead Response Rate</label>
        <input type="range" id="lead-response-rate" min="0" max="100" step="0.01" value="40">
        <div class="slider-value" id="lead-response-rate-value">40.00%</div>
      </div>

      <div class="slider-group">
        <label for="prospect-response-rate" data-i18n="prospectResponseRate">Prospect Response Rate</label>
        <input type="range" id="prospect-response-rate" min="0" max="100" step="0.01" value="20">
        <div class="slider-value" id="prospect-response-rate-value">20.00%</div>
      </div>
    </section>
  </main>

</div>
<script src="js/calculations.js"></script>
<script src="js/chart.js"></script>
<script src="js/i18n.js"></script>
<script src="js/language-select.js"></script>
<script src="js/main.js"></script>
</body>
</html>
