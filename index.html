<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadPredictor</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="logo">
      <span class="logo-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 4h18l-7 9v6l-4 2v-8z" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="logo-text">LeadPredictor</span>
    </div>
  </header>

  <aside class="sidebar" id="sidebar">
    <div class="field">
      <label for="language-select">Language</label>
      <select id="language-select">
        <option value="en" selected>🇺🇸 English</option>
        <option value="bg">🇧🇬 Български</option>
        <option value="es">🇪🇸 Español</option>
        <option value="de">🇩🇪 Deutsch</option>
      </select>
    </div>

    <div class="field">
      <label for="currency-select">Currency</label>
      <select id="currency-select">
        <option value="USD" data-symbol="$" selected>$ US Dollar</option>
        <option value="EUR" data-symbol="€">€ Euro</option>
        <option value="BGN" data-symbol="лв">лв Bulgarian Lev</option>
        <option value="GBP" data-symbol="£">£ British Pound</option>
      </select>
    </div>

    <div class="field">
      <label for="campaign-start">Campaign Start</label>
      <input type="date" id="campaign-start" value="2026-05-08">
    </div>

    <div class="field">
      <label for="campaign-end">Campaign End</label>
      <input type="date" id="campaign-end" value="2026-11-04">
    </div>

    <div class="field">
      <label for="total-revenue">Total Revenue</label>
      <div class="input-with-prefix">
        <span class="prefix" data-currency-symbol>$</span>
        <input type="number" id="total-revenue" min="0" step="100" value="10000">
      </div>
    </div>

    <div class="field">
      <label for="avg-order-value">Avg. Order Value</label>
      <div class="input-with-prefix">
        <span class="prefix" data-currency-symbol>$</span>
        <input type="number" id="avg-order-value" min="1" step="10" value="1000">
      </div>
    </div>
  </aside>

  <main class="content">
    <section class="chart-panel">
      <div class="chart-container" id="chart-container"></div>
      <div class="stat-cards" id="stat-cards">
        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-icon">📥</span>
            <span class="stat-title">Prospects</span>
            <span class="stat-percent" id="prospects-percent">100%</span>
          </div>
          <div class="stat-value" id="prospects-value">0</div>
          <div class="progress-track"><div class="progress-fill" id="prospects-progress"></div></div>
        </div>

        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-icon">👤</span>
            <span class="stat-title">Leads</span>
            <span class="stat-percent" id="leads-percent">0%</span>
          </div>
          <div class="stat-value" id="leads-value">0</div>
          <div class="progress-track"><div class="progress-fill" id="leads-progress"></div></div>
        </div>

        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-icon">🏆</span>
            <span class="stat-title">Customers</span>
            <span class="stat-percent" id="customers-percent">0%</span>
          </div>
          <div class="stat-value" id="customers-value">0</div>
          <div class="progress-track"><div class="progress-fill" id="customers-progress"></div></div>
        </div>
      </div>
    </section>

    <section class="sliders-panel" id="sliders-panel">
      <!-- response rate sliders added in a later change -->
    </section>
  </main>

</div>
<script src="js/calculations.js"></script>
<script src="js/chart.js"></script>
<script src="js/main.js"></script>
</body>
</html>
