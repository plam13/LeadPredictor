<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadPredictor</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="logo">
      <span class="logo-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 4h18l-7 9v6l-4 2v-8z" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="logo-text">LeadPredictor</span>
    </div>
  </header>

  <aside class="sidebar" id="sidebar">
    <!-- settings controls added in a later change -->
  </aside>

  <main class="content">
    <section class="chart-panel">
      <div class="chart-container" id="chart-container">
        <p class="placeholder">Funnel chart coming soon</p>
      </div>
      <div class="stat-cards" id="stat-cards">
        <!-- stat cards added in a later change -->
      </div>
    </section>

    <section class="sliders-panel" id="sliders-panel">
      <!-- response rate sliders added in a later change -->
    </section>
  </main>

</div>
</body>
</html>
